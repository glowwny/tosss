<style>
/* Layout: one reading column; sticky search + category chips; each category is a plain list of tab rows */
:root {
  --bg: #f4f6f8;

  --fg: #16202b;
  --muted: #5d6b7a;
  --line: #dde3ea;
  --accent: #0b6bcb;
  --accent-soft: #e3effb;
  --done: #9aa6b2;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --fg: #e6ecf2; --muted: #93a2b2;
    --line: #26323f; --accent: #5aa7f5; --accent-soft: #15283c; --done: #5d6b7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --fg: #e6ecf2; --muted: #93a2b2;
  --line: #26323f; --accent: #5aa7f5; --accent-soft: #15283c; --done: #5d6b7a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
header h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); font-size: 0.93rem; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px; margin-top: 18px;
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
}
.search-row { display: flex; gap: 8px; align-items: center; }
#q {
  flex: 1; min-width: 0; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px;
}
#q:focus-visible, .chip:focus-visible, .row a:focus-visible, .toggle:focus-visible, input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle {
  font: inherit; font-size: 0.85rem; white-space: nowrap; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
}
.toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: inherit; font-size: 0.85rem; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px;
}
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] span { color: inherit; opacity: 0.7; }

section { margin-top: 28px; }
section h2 { display: flex; align-items: baseline; gap: 8px; font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
section h2 small { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-weight: 400; }
section > p.hint { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.row .txt { min-width: 0; flex: 1; }
.row a { color: var(--fg); text-decoration: none; font-weight: 500; overflow-wrap: anywhere; }
.row a:hover { color: var(--accent); text-decoration: underline; }
.row .dom { display: block; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
.row.done a, .row.done .label { color: var(--done); text-decoration: line-through; }
.row .label { font-weight: 500; }
.empty { margin-top: 32px; color: var(--muted); text-align: center; }
footer { margin-top: 40px; font-size: 0.82rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .row { transition: opacity .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Safari 탭 정리</h1>

<script>
(function () {
  var CATS = [
    ["job", "채용 · 커리어"],
    ["design", "디자인 · UX 학습"],
    ["ai", "AI · 바이브코딩 학습"],
    ["tool", "툴 · 서비스"],
    ["event", "행사 · 웨비나"],
    ["read", "아티클 · 블로그"],
    ["ref", "포트폴리오 · 레퍼런스"],
    ["form", "설문 · 노션 · 오픈채팅"],
    ["shop", "쇼핑"],
    ["health", "운동 · 건강 · 뷰티"],
    ["life", "여행 · 생활 · 기타"],
    ["close", "닫아도 되는 탭"]
  ];
  var NAME = {}; CATS.forEach(function (c) { NAME[c[0]] = c[1]; });

  var items = document.getElementById("data").textContent.trim().split("\n").map(function (line, i) {
    var p = line.split("|");
    var url = p.slice(2).join("|").trim();
    var dom = "";
    if (url) { try { dom = new URL(url).hostname.replace(/^(www|m)\./, ""); } catch (e) { dom = ""; } }
    if (dom.indexOf("xn--3h3bl7foc243a8lq") === 0) dom = "상생페이백.kr";
    return { id: url || ("close-" + i), cat: p[0].trim(), title: p[1].trim(), url: url, dom: dom };
  });

  var KEY = "safari-tabs-done-v1";
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  var state = { cat: "all", q: "", hideDone: false };
  var $list = document.getElementById("list"), $chips = document.getElementById("chips"),
      $q = document.getElementById("q"), $hide = document.getElementById("hideDone"),
      $empty = document.getElementById("empty"), $stats = document.getElementById("stats");

  function counts() {
    var c = { all: 0 };
    items.forEach(function (it) { c[it.cat] = (c[it.cat] || 0) + 1; c.all++; });
    return c;
  }
  var C = counts();

  function renderStats() {
    var linked = items.filter(function (i) { return i.url; }).length;
    var checked = items.filter(function (i) { return done[i.id]; }).length;
    $stats.innerHTML = "<span>남겨둘 링크 <b>" + linked + "</b>개</span>" +
      "<span>닫아도 되는 탭 <b>" + C.close + "</b>건</span>" +
      "<span>카테고리 <b>" + (CATS.length - 1) + "</b>개</span>" +
      "<span>확인함 <b>" + checked + "</b>개</span>";
  }

  function renderChips() {
    var all = [["all", "전체"]].concat(CATS);
    $chips.innerHTML = "";
    all.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", state.cat === c[0] ? "true" : "false");
      b.innerHTML = c[1] + "<span>" + (C[c[0]] || 0) + "</span>";
      b.addEventListener("click", function () { state.cat = c[0]; renderChips(); render(); });
      $chips.appendChild(b);
    });
  }

  function esc(s) { return s.replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  function render() {
    var q = state.q.toLowerCase();
    var html = "", shown = 0;
    CATS.forEach(function (c) {
      if (state.cat !== "all" && state.cat !== c[0]) return;
      var rows = items.filter(function (it) {
        if (it.cat !== c[0]) return false;
        if (state.hideDone && done[it.id]) return false;
        if (q && (it.title + " " + it.dom + " " + it.url).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      if (!rows.length) return;
      shown += rows.length;
      html += '<section><h2>' + c[1] + ' <small>' + rows.length + '</small></h2>';
      if (c[0] === "close") html += '<p class="hint">결제·인증·주문 완료처럼 한 번 쓰고 끝난 페이지예요. 개인 정보가 들어 있을 수 있어 링크는 빼 두었어요.</p>';
      html += '<ul>';
      rows.forEach(function (it) {
        var isDone = !!done[it.id];
        var cid = "c-" + btoa(unescape(encodeURIComponent(it.id))).replace(/[^a-zA-Z0-9]/g, "").slice(-24);
        html += '<li class="row' + (isDone ? " done" : "") + '"><input type="checkbox" id="' + cid + '" data-id="' + esc(it.id) + '"' + (isDone ? " checked" : "") + ' aria-label="확인함 표시">';
        html += '<div class="txt">';
        if (it.url) html += '<a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a><span class="dom">' + esc(it.dom) + '</span>';
        else html += '<span class="label">' + esc(it.title) + '</span>';
        html += '</div></li>';
      });
      html += '</ul></section>';
    });
    $list.innerHTML = html;
    $empty.hidden = shown > 0;
  }

  $list.addEventListener("change", function (e) {
    var t = e.target;
    if (!t.matches("input[type=checkbox]")) return;
    var id = t.getAttribute("data-id");
    if (t.checked) done[id] = 1; else delete done[id];
    save();
    t.closest(".row").classList.toggle("done", t.checked);
    renderStats();
    if (state.hideDone && t.checked) render();
  });
  $q.addEventListener("input", function () { state.q = $q.value.trim(); render(); });
  $hide.addEventListener("click", function () {
    state.hideDone = !state.hideDone;
    $hide.setAttribute("aria-pressed", state.hideDone ? "true" : "false");
    render();
  });

  renderStats(); renderChips(); render();
})();
</script>
